name: Feature request
description: Suggest a focused improvement to HzPilot
title: "feat: "
labels:
  - enhancement
  - needs-triage
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What problem would this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful solution.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: The proposal can remain native, lightweight, and usable without administrator rights.
          required: true
        - label: The proposal does not require telemetry or runtime network access.
          required: true
